name: Build Sahabat Salat APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools" || true
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sahabat-salat-debug.apk

      - name: Upload Sahabat Salat APK
        uses: actions/upload-artifact@v4
        with:
          name: sahabat-salat-debug-apk
          path: sahabat-salat-debug.apk
          retention-days: 30
